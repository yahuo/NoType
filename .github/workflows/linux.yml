name: Linux

on:
  push:
    branches:
      - master
    paths:
      - linux/**
      - integrations/omarchy/**
      - integrations/fcitx5/**
      - .github/workflows/linux.yml
  pull_request:
    paths:
      - linux/**
      - integrations/omarchy/**
      - integrations/fcitx5/**
      - .github/workflows/linux.yml
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Shell Syntax
        working-directory: .
        run: |
          bash -n integrations/omarchy/install.sh
          bash -n integrations/fcitx5/install.sh

      - name: fcitx5 Addon Detector
        working-directory: .
        run: make -C integrations/fcitx5 test
